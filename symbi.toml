# =============================================================================
# symbi.toml -- Runtime configuration for the governed pen test platform
# =============================================================================

[runtime]
max_agents = 8                      # Concurrent agent count (controller + 1 phase agent active at a time)
memory_limit_mb = 512               # Per-agent memory ceiling
execution_timeout_seconds = 1800    # 30 min per phase agent (controller has no timeout)

[security]
default_sandbox_tier = "docker"     # Tier 1: Docker isolation
audit_enabled = true                # Cryptographic audit trail
policy_enforcement = "strict"       # Deny-by-default; all actions need explicit allow
allow_native_execution = false      # Never run tools outside the sandbox

[security.capabilities]
allowed = ["net_raw", "net_admin"]  # SYN scans + tunneling
denied = ["*"]                      # Deny everything else

[policy]
policy_dir = "policies"
default_decision = "deny"
evaluation_timeout_ms = 5

[audit]
enabled = true
output_dir = ".symbiont/audit"
format = "jsonl"
hash_chain = true
include_tool_args = true
include_tool_output = false
rotation = "daily"

[vector_db]
enabled = true
backend = "lancedb"
collection_name = "redteam_embeddings"  # Single collection with type discriminator

[mcp]
server_port = 8943
tools_dir = "src"

[toolclad]
tools_dir = "tools"
custom_types = "toolclad.toml"
hot_reload = false

[agent]
max_iterations = 15                 # Max ORGA loop iterations per phase
model = "claude-sonnet-4-6-20260401"
temperature = 0.1

[approvals.slack]
enabled = false
bot_token_env = "SLACK_BOT_TOKEN"
signing_secret_env = "SLACK_SIGNING_SECRET"
channel = "#symbi-approvals"
approvers = []
dm_approvers = true
events_bind_addr = "0.0.0.0:9082"
