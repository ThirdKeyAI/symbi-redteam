[tool]
name = "sqlmap_scan"
version = "1.0.0"
binary = "sqlmap"
description = "SQL injection detection and exploitation"
timeout_seconds = 600
risk_tier = "high"
human_approval = true

[tool.cedar]
resource = "PenTest::ScanTarget"
action = "execute_tool"

[args.target]
position = 1
required = true
type = "url"
description = "Target URL with injectable parameter"

[args.mode]
position = 2
required = true
type = "enum"
allowed = ["detect", "exploit"]
description = "Detection only or full exploitation"

[args.level]
position = 3
required = false
type = "integer"
default = 1
min = 1
max = 5
description = "Test level (1-5, higher = more tests)"

[args.risk]
position = 4
required = false
type = "integer"
default = 1
min = 1
max = 3
description = "Risk level (1-3, higher = more intrusive)"

[command]
executor = "/app/scripts/tool-wrappers/sqlmap-wrapper.sh"

[output]
format = "json"
envelope = true

[output.schema]
type = "object"
