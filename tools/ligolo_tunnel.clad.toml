[tool]
name = "ligolo_tunnel"
version = "1.0.0"
binary = "ligolo-ng"
description = "Reverse tunneling for network pivoting"
timeout_seconds = 3600
risk_tier = "critical"
human_approval = true

[tool.cedar]
resource = "PenTest::ScanTarget"
action = "execute_tool"

[args.mode]
position = 1
required = true
type = "enum"
allowed = ["agent", "proxy"]
description = "Ligolo operating mode"

[args.connect_addr]
position = 2
required = false
type = "string"
default = ""
description = "Address to connect to (agent mode)"

[args.listen_addr]
position = 3
required = false
type = "string"
default = ""
description = "Address to listen on (proxy mode)"

[command]
executor = "/app/scripts/tool-wrappers/ligolo-wrapper.sh"

[output]
format = "text"
envelope = true

[output.schema]
type = "object"
