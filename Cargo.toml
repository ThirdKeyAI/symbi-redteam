[package]
name = "symbi-redteam"
version = "1.0.0"
edition = "2021"
description = "Governed autonomous penetration testing platform"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
lancedb = "0.26"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
arrow-array = "57"
futures = "0.3.32"
axum = { version = "0.7", features = ["macros"] }
dashmap = "5"
subtle = "2"
async-trait = "0.1"
hmac = "0.12"
hex = "0.4"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
thiserror = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tracing = "0.1"
symbi-channel-adapter = { path = "../../../symbiont/crates/channel-adapter", features = ["slack"] }
symbi-runtime = { path = "../../../symbiont/crates/runtime" }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
