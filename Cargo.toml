[package]
name = "symbi-redteam"
version = "1.0.0"
edition = "2021"
description = "Governed autonomous penetration testing platform"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
lancedb = "0.26"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
arrow-array = "57"
futures = "0.3.32"
axum = { version = "0.7", features = ["macros"] }
dashmap = "5"
subtle = "2"
async-trait = "0.1"
hmac = "0.12"
hex = "0.4"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
thiserror = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tracing = "0.1"
urlencoding = "2"
symbi-channel-adapter = { version = "0.1.3", features = ["slack"] }
symbi-runtime = "1.14.1"
# Web viewer (read-only dashboard binary, src/bin/web.rs)
maud = { version = "0.26", features = ["axum"] }
tower-http = { version = "0.5", features = ["set-header"] }
pulldown-cmark = { version = "0.11", default-features = false, features = ["html"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Ed25519 signing / seed verification
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
rand = "0.8"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tower = { version = "0.4", features = ["util"] }

[[bin]]
name = "redteam-web"
path = "src/bin/web.rs"

[[bin]]
name = "redteam-seed"
path = "src/bin/seed.rs"

[[bin]]
name = "redteam-seal"
path = "src/bin/seal.rs"
