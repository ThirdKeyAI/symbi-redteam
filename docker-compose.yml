# =============================================================================
# docker-compose.yml -- Governed pen test platform with resource limits
#
# Key security decisions:
#   - CAP_NET_RAW + CAP_NET_ADMIN: Required for SYN scans and tunneling.
#   - All other capabilities: Dropped.
#   - Read-only root filesystem: Agent can't modify its own code or policies.
#   - tmpfs for /tmp: Ephemeral scratch space for Metasploit and tool output.
#   - Memory/CPU limits: Prevents resource exhaustion.
#   - No network_mode=host: Container gets its own network namespace.
#   - Policies mounted read-only: Agent can't modify its own governance.
# =============================================================================

services:
  agent:
    build: .
    image: symbi-redteam:latest

    # Grant capabilities needed for the offensive toolchain.
    # NET_RAW: nmap SYN scans, raw socket operations
    # NET_ADMIN: chisel/ligolo tunneling, route manipulation
    cap_add:
      - NET_RAW
      - NET_ADMIN
    cap_drop:
      - ALL

    # Security options
    security_opt:
      - no-new-privileges:true

    # Resource limits -- Metasploit and nuclei need more than basic nmap
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"

    # Read-only root filesystem -- agent can't modify its own code or policies
    read_only: true
    tmpfs:
      - /tmp:size=256M

    # Volumes
    volumes:
      # Policies: read-only mount. Operator can update without rebuild.
      - ./policies:/app/policies:ro

      # Scope: read-only. Defines engagement targets.
      - ./scope:/app/scope:ro

      # Audit logs: persist to host for compliance/review
      - ./audit-logs:/app/.symbiont/audit

      # Scan results: persist for historical analysis
      - ./scan-results:/app/.symbiont/scans

      # Evidence store: persist finding artifacts
      - ./evidence:/app/.symbiont/evidence

      # Database: persist SQLite + LanceDB
      - ./data:/app/.symbiont/data

      # Reports: persist generated reports
      - ./reports:/app/.symbiont/reports

    # Runtime configuration
    environment:
      - SYMBI_LOG_LEVEL=info
      - SYMBI_RUNTIME_MODE=production
      - RUST_LOG=symbi=info,cedar=warn

      # LLM provider for the Reason phase
      # In production, use a secrets manager -- not env vars
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

      # Database paths
      - SYMBI_DB_PATH=/app/.symbiont/data/redteam.db
      - SYMBI_LANCE_PATH=/app/.symbiont/data/lance

      # Tool safety defaults
      - NMAP_MAX_RATE=1000
      - NMAP_DEFAULT_TIMING=T3

    # Use default bridge network so we can reach test targets
    # like Juice Shop at 172.17.0.2
    network_mode: bridge
